name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Nothing is built or uploaded unless the code passes every check on every OS.
  verify:
    strategy:
      fail-fast: true
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Sync app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/version.mjs set "${{ github.ref_name }}"

      - name: Verify version files match
        run: node scripts/version.mjs check ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Type-check and build the frontend
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # One release per tag. Every build below uploads into this exact release (by id),
  # so re-running failed jobs fills in the missing files instead of making new drafts.
  release:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.find.outputs.id }}
    steps:
      # Every release must carry a signed update, or installed apps can't update to it.
      - name: Check the update signing key is set
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$KEY" ]]; then
            echo "::error::Missing the TAURI_SIGNING_PRIVATE_KEY secret. Add it under Settings → Secrets and variables → Actions (see README → In-app updates)."
            exit 1
          fi

      - name: Find or create the draft release
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Drafts have no tag yet, so match on tag_name across all releases (drafts included).
          id="$(gh api "repos/$REPO/releases?per_page=100" --paginate \
            --jq "[.[] | select(.tag_name == \"$TAG\")] | sort_by(.created_at) | .[0].id // empty" | head -n 1)"
          if [[ -n "$id" ]]; then
            echo "Using existing release $id for $TAG"
          else
            body="$(cat <<BODY
          ## Downloads

          | Platform | Link |
          | --- | --- |
          | macOS Apple Silicon | [MemeFactory-macos-arm64.dmg](https://github.com/$REPO/releases/latest/download/MemeFactory-macos-arm64.dmg) |
          | macOS Intel | [MemeFactory-macos-x64.dmg](https://github.com/$REPO/releases/latest/download/MemeFactory-macos-x64.dmg) |
          | Windows | [MemeFactory-windows-x64.msi](https://github.com/$REPO/releases/latest/download/MemeFactory-windows-x64.msi) |
          | Linux AppImage | [MemeFactory-linux-x86_64.AppImage](https://github.com/$REPO/releases/latest/download/MemeFactory-linux-x86_64.AppImage) |
          | Linux deb | [MemeFactory-linux-amd64.deb](https://github.com/$REPO/releases/latest/download/MemeFactory-linux-amd64.deb) |

          Free and open source (MIT).
          BODY
          )"
            id="$(gh api -X POST "repos/$REPO/releases" \
              -f tag_name="$TAG" -f name="MemeFactory $TAG" -f body="$body" \
              -F draft=true -F prerelease=false --jq .id)"
            echo "Created draft release $id for $TAG"
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  publish:
    needs: [verify, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            alias_glob: "**/*aarch64*.dmg"
            alias_name: MemeFactory-macos-arm64.dmg
            smoke_bin: src-tauri/target/aarch64-apple-darwin/release/memefactory
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            alias_glob: "**/*x64*.dmg"
            alias_name: MemeFactory-macos-x64.dmg
            # Intel build: can't be launched on the Apple Silicon runner, so no smoke test.
            smoke_bin: ""
          - platform: ubuntu-22.04
            args: ""
            alias_glob: "**/*.AppImage"
            alias_name: MemeFactory-linux-x86_64.AppImage
            alias_glob_extra: "**/*.deb"
            alias_name_extra: MemeFactory-linux-amd64.deb
            smoke_bin: src-tauri/target/release/memefactory
            smoke_prefix: xvfb-run -a
          - platform: windows-latest
            args: ""
            alias_glob: "**/*.msi"
            alias_name: MemeFactory-windows-x64.msi
            smoke_bin: src-tauri/target/release/memefactory.exe

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Sync app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/version.mjs set "${{ github.ref_name }}"

      - name: Verify version files match
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/version.mjs check "${{ github.ref_name }}"

      - name: Verify version files match
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: node scripts/version.mjs check

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev \
            xvfb

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend deps
        run: npm ci

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles; installed apps only accept updates signed with this key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.release.outputs.id }}
          # Builds the signed update bundles and latest.json the in-app updater reads.
          args: ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json

      # The release stays a draft until you publish it; a red job here means don't.
      - name: Smoke test (launch the built app)
        if: matrix.smoke_bin != ''
        shell: bash
        env:
          SMOKE_PREFIX: ${{ matrix.smoke_prefix }}
        run: scripts/smoke-test.sh "${{ matrix.smoke_bin }}" 20

      - name: Upload stable download alias
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALIAS_GLOB: ${{ matrix.alias_glob }}
          ALIAS_NAME: ${{ matrix.alias_name }}
          ALIAS_GLOB_EXTRA: ${{ matrix.alias_glob_extra }}
          ALIAS_NAME_EXTRA: ${{ matrix.alias_name_extra }}
          REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.release.outputs.id }}
        run: |
          set -euo pipefail
          upload_alias () {
            local pattern="$1"
            local name="$2"
            [[ -z "$pattern" || -z "$name" ]] && return 0
            local file
            file="$(find src-tauri/target -type f -path "$pattern" | head -n 1 || true)"
            if [[ -z "$file" ]]; then
              echo "No artifact matched $pattern"
              return 0
            fi
            # Replace an older upload with the same name, then upload into this release.
            local old
            old="$(gh api "repos/$REPO/releases/$RELEASE_ID/assets?per_page=100" \
              --jq ".[] | select(.name == \"$name\") | .id")"
            [[ -n "$old" ]] && gh api -X DELETE "repos/$REPO/releases/assets/$old"
            gh api -X POST "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$name" \
              -H "Content-Type: application/octet-stream" --input "$file" --jq .browser_download_url
            echo "Uploaded $name from $file"
          }
          upload_alias "$ALIAS_GLOB" "$ALIAS_NAME"
          upload_alias "${ALIAS_GLOB_EXTRA:-}" "${ALIAS_NAME_EXTRA:-}"
