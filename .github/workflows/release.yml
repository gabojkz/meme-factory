name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            alias_glob: "**/*aarch64*.dmg"
            alias_name: MemeFactory-macos-arm64.dmg
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            alias_glob: "**/*x64*.dmg"
            alias_name: MemeFactory-macos-x64.dmg
          - platform: ubuntu-22.04
            args: ""
            alias_glob: "**/*.AppImage"
            alias_name: MemeFactory-linux-x86_64.AppImage
            alias_glob_extra: "**/*.deb"
            alias_name_extra: MemeFactory-linux-amd64.deb
          - platform: windows-latest
            args: ""
            alias_glob: "**/*.msi"
            alias_name: MemeFactory-windows-x64.msi

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Sync app version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/version.mjs set "${GITHUB_REF_NAME#v}"

      - name: Verify version files match
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            node scripts/version.mjs check "${GITHUB_REF_NAME#v}"
          else
            node scripts/version.mjs check
          fi

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend deps
        run: npm ci

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: MemeFactory ${{ github.ref_name }}
          releaseBody: |
            ## Downloads

            | Platform | Link |
            | --- | --- |
            | macOS Apple Silicon | [MemeFactory-macos-arm64.dmg](https://github.com/${{ github.repository }}/releases/latest/download/MemeFactory-macos-arm64.dmg) |
            | macOS Intel | [MemeFactory-macos-x64.dmg](https://github.com/${{ github.repository }}/releases/latest/download/MemeFactory-macos-x64.dmg) |
            | Windows | [MemeFactory-windows-x64.msi](https://github.com/${{ github.repository }}/releases/latest/download/MemeFactory-windows-x64.msi) |
            | Linux AppImage | [MemeFactory-linux-x86_64.AppImage](https://github.com/${{ github.repository }}/releases/latest/download/MemeFactory-linux-x86_64.AppImage) |
            | Linux deb | [MemeFactory-linux-amd64.deb](https://github.com/${{ github.repository }}/releases/latest/download/MemeFactory-linux-amd64.deb) |

            Free and open source (MIT).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload stable download alias
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALIAS_GLOB: ${{ matrix.alias_glob }}
          ALIAS_NAME: ${{ matrix.alias_name }}
          ALIAS_GLOB_EXTRA: ${{ matrix.alias_glob_extra }}
          ALIAS_NAME_EXTRA: ${{ matrix.alias_name_extra }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          upload_alias () {
            local pattern="$1"
            local name="$2"
            [[ -z "$pattern" || -z "$name" ]] && return 0
            local file
            file="$(find src-tauri/target -type f -path "$pattern" | head -n 1 || true)"
            if [[ -z "$file" ]]; then
              echo "No artifact matched $pattern"
              return 0
            fi
            cp "$file" "$name"
            gh release upload "$TAG" "$name" --clobber
            echo "Uploaded $name from $file"
          }
          upload_alias "$ALIAS_GLOB" "$ALIAS_NAME"
          upload_alias "${ALIAS_GLOB_EXTRA:-}" "${ALIAS_NAME_EXTRA:-}"
