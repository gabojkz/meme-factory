name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libayatana-appindicator3-dev \
            xvfb

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci
      - name: Check version files match
        if: matrix.platform == 'ubuntu-22.04'
        run: npm run version:check
      - run: npm run build
      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # Release-mode app (frontend embedded), launched for 20s to catch startup crashes.
      - name: Build the app (no installers)
        run: npx tauri build --no-bundle

      - name: Smoke test (launch the built app)
        shell: bash
        env:
          SMOKE_PREFIX: ${{ matrix.platform == 'ubuntu-22.04' && 'xvfb-run -a' || '' }}
        run: |
          BIN=src-tauri/target/release/memefactory
          [[ "$RUNNER_OS" == "Windows" ]] && BIN="$BIN.exe"
          scripts/smoke-test.sh "$BIN" 20
