[[permission]]
identifier = "allow-meme-ops"
description = "Allows meme library commands"
commands.allow = [
  "list_memes",
  "search_memes",
  "import_meme",
  "import_meme_bytes",
  "fetch_image_url",
  "delete_meme",
  "update_meme_ocr",
  "update_meme_tags",
  "list_tags",
  "meme_count",
  "library_stats",
  "erase_plan",
  "erase_everything",
  "quit_after_erase",
  "copy_meme",
  "get_settings",
  "set_memes_folder",
  "reset_memes_folder",
  "sync_library",
  "save_creation",
  "list_projects",
  "load_project",
  "save_project",
  "delete_project",
  "library_state",
  "library_download",
  "library_cancel",
  "library_upload",
  "library_remove",
  "library_favourite",
  "library_clear_cache",
  "pack_inspect",
  "pack_install",
  "pack_install_remote",
  "pack_remove",
  "catalog_fetch",
  "catalog_sanitize",
  "online_search"
]
