[[permission]]
identifier = "allow-meme-ops"
description = "Allows meme library commands"
commands.allow = [
  "list_memes",
  "search_memes",
  "import_meme",
  "delete_meme",
  "update_meme_ocr",
  "meme_count",
  "copy_meme",
  "get_settings",
  "set_memes_folder",
  "reset_memes_folder",
  "sync_library"
]
